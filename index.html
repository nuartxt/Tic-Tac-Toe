<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="js.js" defer></script>
    <title>Tic-Toc-Tac</title>
</head>

<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <h2></h2>

        <form class="playerChoice" id="playerChoice">
            <div>
                <p>Player one</p>
                <input type="text" id="player1" placeholder="Player one name" required>
            </div>
            <div>
                <p>Player two</p>
                <input type="text" id="player2" placeholder="Player two name" required>
            </div>
            <div>
                <button class="btn play" id="play">play</button>
            </div>
        </form>

        <div class="players"></div>

        <ul class="gameBox none" id="gameBox">
            <li id="1" class="gameBoxItem"></li>
            <li id="2" class="gameBoxItem"></li>
            <li id="3" class="gameBoxItem"></li>
            <li id="4" class="gameBoxItem"></li>
            <li id="5" class="gameBoxItem"></li>
            <li id="6" class="gameBoxItem"></li>
            <li id="7" class="gameBoxItem"></li>
            <li id="8" class="gameBoxItem"></li>
            <li id="9" class="gameBoxItem"></li>
        </ul>
        <button class="btn replay none" id="replay">replay</button>
    </div>
</body>

</html>
